[package]
name = "opencode2api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "process"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sea-orm-migration = { version = "1.1", features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
argon2 = { version = "0.5.3", features = ["rand"] }
aes-gcm = "0.11"
rand = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1", features = ["derive"] }
reqwest = { version = "0.13", features = ["stream", "json", "query", "socks"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"
sha2 = "0.10"
futures-util = "0.3"
tokio-tungstenite = "0.29"
async-stream = "0.3"
http-body-util = "0.1"
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
http = "1"
